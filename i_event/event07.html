<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>첨부파일 썸네일</title>
    <style>
        div.wrap {
            width: 200px;
            height: 200px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        #attach {
            display: none;
        }

        .image {
            width: 200px;
            height: 200px;
            background-image: url("./images/basic.jpg");
            background-position: center;
            background-repeat: no-repeat;
            background-size: 100%;
            cursor: pointer;
        }

        .cancel {
            width: 20px;
            height: 20px;
            background-image: url("./images/cancel.png");
            background-position: center;
            background-repeat: no-repeat;
            background-size: 100%;
            position: absolute;
            top: 12px;
            right: 12px;
            cursor: pointer;
            display: none;
        }
    </style>
</head>
<body>
    <form action="#">
        <div class="wrap">
            <label for="attach">
                <div class="image"></div>
            </label>
            <div class="cancel"></div>
        </div>
        <input id="attach" type="file">
    </form>
</body>
<script>
    const input = document.querySelector("#attach")
    const thumbnail = document.querySelector(".image")
    const cancel = document.querySelector(".cancel")

    input.addEventListener("change", (e) => {
        console.log(e)
        const reader = new FileReader()
        const file = e.target.files[0]
        reader.readAsDataURL(file)
        reader.onload = (e) => {
            const path = e.target.result
            cancel.style.display = "block";
            if(path.includes("image")){
                thumbnail.style.backgroundImage = `url(${path})`
            }else {
                thumbnail.style.backgroundImage = `url(./images/basic.jpg)`
            }
        }
    })

    cancel.addEventListener("click", (e) => {
        input.value = ""
        cancel.style.display = "none"
        thumbnail.style.backgroundImage = `url(./images/basic.jpg)`
    })
</script>
</html>
