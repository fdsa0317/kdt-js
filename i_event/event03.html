<!DOCTYPE html>
<html lang="en">
<head>

    <title>클릭 이벤트(유효성 검사)</title>
</head>
<body>
    <form action="데이터받을주소">
        <div>
            <span>아이디</span>
            <input id="id" type="text" placeholder="아이디 입력" />
            <p id="id-result"></p>
        </div>
        <div>
            <span>비밀번호</span>
            <input id="password" type="password" placeholder="비밀번호 입력" />
            <p id="password-result"></p>
        </div>
        <!-- button type submit(default) -->
        <button type="button" id="button">완료</button>
    </form>
</body>
<script>
    globalThis.flag = Array.of(false, false)

    const button = document.querySelector("#button")
    const idResult = document.querySelector("#id-result")
    const passwordResult = document.querySelector("#password-result")
    const form = document.querySelector("form")

    id.addEventListener("blur", (e) => {
        const target = e.target

        if(!target.value){
            idResult.innerText = "아이디를 입력하세요."
            idResult.style.color = "red"
            globalThis.flag[0] = false
            return;
        }

        idResult.innerText = "멋진 아이디네요😎"
        idResult.style.color = "blue"
        globalThis.flag[0] = true

    })
